# Keeps Go modules and GitHub Actions current. The commit prefixes follow the
# ECC commit format, so Dependabot's commits pass the gate.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
