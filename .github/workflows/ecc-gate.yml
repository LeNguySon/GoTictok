# The final, non-bypassable copy of the ECC gate.
#
# Local git hooks can be skipped by a person or an agent; this job cannot.
# Make it a required status check on the default branch so nothing merges red.
name: ECC gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ecc-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commit subjects of the whole pull request are checked

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: .tools/bin
          key: ecc-tools-${{ runner.os }}-${{ hashFiles('tools/eccgate/setup.go', 'go.mod') }}

      - name: Install pinned tools
        run: go run ./tools/eccgate setup --tools-only

      - name: Gate (full profile)
        run: go run ./tools/eccgate verify

      - name: Commit messages (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: go run ./tools/eccgate commits "origin/${BASE_REF}..HEAD"

      - name: Commit message (push)
        if: github.event_name == 'push'
        run: go run ./tools/eccgate commits
